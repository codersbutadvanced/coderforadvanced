<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secure Terminal Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Authentication -->
  <div id="auth" class="terminal">
    <h2>> Enter Passphrase to Start</h2>
    <input type="password" id="passphrase" placeholder="Your encryption password..." />
    <button onclick="initKey()">Start Secure Session</button>
  </div>

  <!-- Main Terminal Interface -->
  <div id="chat-container" style="display: none;">
    <div class="terminal">
      <h2>> White-Hat Secure Terminal</h2>

      <!-- Command / Chat Output -->
      <div id="chat-box"></div>

      <!-- User Input -->
      <input type="text" id="input" placeholder="Type command or message..." autocomplete="off" />

      <!-- Controls -->
      <div class="controls">
        <button onclick="clearChat()">🧹 Panic (Clear All)</button>
        <button onclick="startNetworkScan()">🛰️ Scan</button>
        <button onclick="toggleFirewall()">🧱 Firewall</button>
        <button onclick="startFakeTransfer()">📦 Send File</button>
        <button onclick="show2FA()">🔓 2FA</button>
        <button onclick="generateQR()">🔑 QR Key</button>
        <button onclick="darknetDrop()">💀 Darknet Drop</button>
      </div>

      <!-- Firewall Canvas -->
      <div id="firewall-panel" style="display:none; margin-top:10px;">
        <canvas id="firewallCanvas" width="560" height="120"></canvas>
      </div>

      <!-- QR Display -->
      <div id="qr-panel" style="display:none; margin-top:10px;">
        <h3>🔑 Session Key QR</h3>
        <div id="qrcode"></div>
      </div>

    </div>
  </div>

  <!-- 2FA Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3>🔐 Two-Factor Authentication</h3>
      <p>Enter the 2FA code sent to your secure device:</p>
      <input type="text" id="twofacode" placeholder="••••••" />
      <button onclick="submit2FA()">Verify</button>
      <button onclick="close2FA()">Cancel</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
